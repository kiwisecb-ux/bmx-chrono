<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>BMX iPhone Pro</title>
  <link rel="stylesheet" href="https://cloudflare.com" />
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --green: #22c55e; --red: #ef4444; --orange: #f59e0b; --text: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 40px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 1.1rem; font-weight: 800; }
    #gps-status { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; background: #334155; font-weight: 600; }
    .gps-ok { background: rgba(34, 197, 94, 0.2) !important; color: var(--green); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .card { background: var(--card); border-radius: 14px; padding: 12px; text-align: center; }
    .val { font-size: 1.8rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .val.main-chrono { font-size: 2.2rem; color: #fff; }
    .label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; margin-top: 4px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    button { border: none; border-radius: 12px; padding: 14px 8px; font-size: 0.85rem; font-weight: 700; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.35; }
    .btn-blue { background: #0284c7; }
    .btn-orange { background: var(--orange); color: #000; }
    .btn-green { background: var(--green); color: #000; }
    .btn-red { background: var(--red); }
    .btn-gray { background: #475569; }
    .full-width { grid-column: span 2; }
    #map { height: 240px; width: 100%; border-radius: 14px; background: #1e293b; margin-bottom: 8px; }
    .section-box { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
    .list-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <h1>BMX Pro <span style="color:#22c55e; font-size:0.7rem;">● V2</span></h1>
    <div id="gps-status">GPS en attente</div>
  </header>

  <div class="grid">
    <div class="card"><div class="val main-chrono" id="chrono">00.00</div><div class="label">Chrono (s)</div></div>
    <div class="card"><div class="val" id="speed">0.0</div><div class="label">Vitesse (km/h)</div></div>
    <div class="card"><div class="val" id="gforce">0.00</div><div class="label">Force G</div></div>
    <div class="card"><div class="val" id="angle">0°</div><div class="label">Angle Virage</div></div>
  </div>

  <div class="controls">
    <button type="button" class="btn-blue" onclick="calibrate()">Calibrer 0°</button>
    <button type="button" class="btn-orange" onclick="startGate()">Grille Départ (Bip)</button>
    <button type="button" class="btn-gray" onclick="addCellHere()">+ Cellule ici</button>
    <button type="button" class="btn-gray" onclick="clearCells()">Effacer Cellules</button>
    <button type="button" class="btn-orange full-width" id="btn-arm" onclick="armAuto()">Armer Départ Auto (Mouvement)</button>
    <button type="button" class="btn-green" id="btn-start" onclick="startRun()">Démarrer Manuellement</button>
    <button type="button" class="btn-red" id="btn-stop" onclick="stopRun()" disabled>Arrêter & Sauver</button>
  </div>

  <div id="map"></div>

  <div class="section-box">
    <div style="font-weight:700; margin-bottom:6px; font-size:0.9rem;">Temps intermédiaires</div>
    <div id="splits-list" style="color:#64748b; font-size:0.8rem;">En attente...</div>
  </div>

  <div class="section-box">
    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <span style="font-weight:700; font-size:0.9rem;">Historique</span>
      <button type="button" class="btn-blue" onclick="exportCSV()" style="padding:4px 8px; font-size:0.75rem;">CSV</button>
    </div>
    <div id="history-list"></div>
  </div>

  <script src="https://cloudflare.com"></script>
  <script>
    let map, userMarker, currentPos = null, cells = [], isRunning = false, isArmed = false;
    let startTime = 0, timerInterval = null, splits = [], angleOffset = 0, rawGamma = 0;
    let maxSpeed = 0, maxG = 0, maxAngle = 0;

    if (typeof L !== 'undefined') {
      map = L.map('map').setView([46.6033, 1.8883], 5);
      L.tileLayer('https://arcgisonline.com{z}/{y}/{x}', { maxZoom: 20 }).addTo(map);
      map.on('click', function(e) { addCell(e.latlng.lat, e.latlng.lng); });
    }

    function addCell(lat, lng) {
      if (!map) return;
      const circle = L.circle([lat, lng], { color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.35, radius: 6 }).addTo(map);
      cells.push({ id: cells.length + 1, lat: lat, lng: lng, circle: circle, passed: false });
    }

    function addCellHere() {
      if (currentPos) addCell(currentPos.lat, currentPos.lng);
      else alert("Attendez que le GPS passe au vert.");
    }

    function clearCells() {
      if (map) cells.forEach(c => map.removeLayer(c.circle));
      cells = [];
    }

    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(function(pos) {
        currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        const gpsEl = document.getElementById('gps-status');
        gpsEl.textContent = "GPS OK (±" + Math.round(pos.coords.accuracy) + "m)";
        gpsEl.classList.add('gps-ok');
        const kmh = pos.coords.speed ? (pos.coords.speed * 3.6) : 0;
        document.getElementById('speed').textContent = kmh.toFixed(1);
        if (isRunning && kmh > maxSpeed) maxSpeed = kmh;
        if (map) {
          if (!userMarker) {
            userMarker = L.circleMarker([currentPos.lat, currentPos.lng], { radius: 7, color: '#22c55e', fillOpacity: 1 }).addTo(map);
            map.setView([currentPos.lat, currentPos.lng], 19);
          } else {
            userMarker.setLatLng([currentPos.lat, currentPos.lng]);
          }
        }
        if (isRunning) checkCells(currentPos.lat, currentPos.lng);
      }, null, { enableHighAccuracy: true });
    }

    function checkCells(lat, lng) {
      cells.forEach((cell, idx) => {
        if (!cell.passed) {
          const R = 6371e3, p1 = lat * Math.PI/180, p2 = cell.lat * Math.PI/180;
          const dp = (cell.lat - lat) * Math.PI/180, dl = (cell.lng - lng) * Math.PI/180;
          const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
          const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
          if (dist <= 6) {
            cell.passed = true;
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
            const isLast = (idx === cells.length - 1);
            splits.push({ name: isLast ? "ARRIVÉE" : "Secteur " + cell.id, time: elapsed });
            document.getElementById('splits-list').innerHTML = splits.map(s => `<div class="list-item"><span>${s.name}</span><b>${s.time}s</b></div>`).join('');
            if (isLast) stopRun();
          }
        }
      });
    }

    function initSensors() {
      if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
        DeviceMotionEvent.requestPermission().then(r => { if (r === 'granted') window.addEventListener('devicemotion', onMotion); }).catch(()=>{});
      } else { window.addEventListener('devicemotion', onMotion); }
      if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
        DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') window.addEventListener('deviceorientation', onOrient); }).catch(()=>{});
      } else { window.addEventListener('deviceorientation', onOrient); }
    }

    function onMotion(e) {
      const a = e.accelerationIncludingGravity;
      if (a && a.x !== null) {
        const g = Math.sqrt(a.x**2 + a.y**2 + a.z**2) / 9.81;
        document.getElementById('gforce').textContent = g.toFixed(2);
        if (isRunning && g > maxG) maxG = g;
      }
      const l = e.acceleration;
      if (isArmed && l && l.x !== null && Math.sqrt(l.x**2 + l.y**2 + l.z**2) > 2.2) {
        isArmed = false;
        startRun();
      }
    }

    function onOrient(e) {
      if (e.gamma !== null) {
        rawGamma = e.gamma;
        const ang = Math.round(rawGamma - angleOffset);
        document.getElementById('angle').textContent = ang + "°";
        if (isRunning && Math.abs(ang) > maxAngle) maxAngle = Math.abs(ang);
      }
    }

    function calibrate() { initSensors(); angleOffset = rawGamma; document.getElementById('angle').textContent = "0°"; }

    function armAuto() {
      initSensors();
      isArmed = true;
      document.getElementById('btn-arm').textContent = "PRÊT - BOUGEZ...";
      document.getElementById('btn-arm').style.background = "#ef4444";
    }

    function startGate() {
      initSensors();
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0.5, 1.1, 1.7].forEach(t => {
        const o = ctx.createOscillator(); o.frequency.value = 632; o.connect(ctx.destination);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.15);
      });
      const o4 = ctx.createOscillator(); o4.frequency.value = 950; o4.connect(ctx.destination);
      o4.start(ctx.currentTime + 2.3); o4.stop(ctx.currentTime + 2.7);
      setTimeout(() => { if (!isRunning) startRun(); }, 2300);
    }

    function startRun() {
Utilisez le code avec précaution.
if (isRunning) return;
isRunning = true; isArmed = false; startTime = Date.now();
splits = []; maxSpeed = 0; maxG = 0; maxAngle = 0;
cells.forEach(c => c.passed = false);
document.getElementById('splits-list').innerHTML = "En cours...";
document.getElementById('btn-arm').textContent = "Armer Départ Auto (Mouvement)";
document.getElementById('btn-arm').style.background = "";
document.getElementById('btn-start').disabled = true;
document.getElementById('btn-stop').disabled = false;
timerInterval = setInterval(() => {
document.getElementById('chrono').textContent = ((Date.now() - startTime) / 1000).toFixed(2);
}, 30);
}
function stopRun() {
if (!isRunning) return;
isRunning = false; clearInterval(timerInterval);
document.getElementById('btn-start').disabled = false;
document.getElementById('btn-stop').disabled = true;
const h = JSON.parse(localStorage.getItem('bmx_runs') || '[]');
h.unshift({ date: new Date().toLocaleTimeString(), time: document.getElementById('chrono').textContent, speed: maxSpeed.toFixed(1), g: maxG.toFixed(2), ang: maxAngle });
localStorage.setItem('bmx_runs', JSON.stringify(h));
renderHistory();
}
function renderHistory() {
const h = JSON.parse(localStorage.getItem('bmx_runs') || '[]');
document.getElementById('history-list').innerHTML = h.length ? h.map(r => <div class="list-item"><span>${r.date} — <b>${r.time}s</b></span><span>${r.speed} km/h | ${r.g}G | ${r.ang}°</span></div>).join('') : 'Aucun run';
}
function exportCSV() {
const h = JSON.parse(localStorage.getItem('bmx_runs') || '[]');
if (!h.length) return alert("Vide");
const csv = "Heure;Temps;Vitesse;G;Angle\n" + h.map(r => ${r.date};${r.time};${r.speed};${r.g};${r.ang}).join('\n');
const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = "bmx.csv"; a.click();
}
renderHistory();
