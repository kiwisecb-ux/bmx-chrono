<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>BMX Pro</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --green: #22c55e; --red: #ef4444; --orange: #f59e0b; --text: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 40px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 1.1rem; font-weight: 800; }
    #gps-status { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; background: #334155; font-weight: 600; }
    .gps-ok { background: rgba(34, 197, 94, 0.2) !important; color: var(--green); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .card { background: var(--card); border-radius: 14px; padding: 12px; text-align: center; }
    .val { font-size: 1.8rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .val.main-chrono { font-size: 2.2rem; color: #fff; }
    .label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; margin-top: 4px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    button { border: none; border-radius: 12px; padding: 14px 8px; font-size: 0.85rem; font-weight: 700; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.35; }
    .btn-blue { background: #0284c7; }
    .btn-orange { background: var(--orange); color: #000; }
    .btn-green { background: var(--green); color: #000; }
    .btn-red { background: var(--red); }
    .btn-gray { background: #475569; }
    .full-width { grid-column: span 2; }
    canvas { width: 100%; height: 260px; background: #090d16; border: 1px solid #334155; border-radius: 14px; display: block; margin-bottom: 6px; }
    .hint { font-size: 0.75rem; color: #94a3b8; text-align: center; margin-bottom: 12px; }
    .section-box { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
    .list-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>BMX Pro <span style="color:#22c55e; font-size:0.7rem;">● PRO GATE</span></h1>
    <div id="gps-status">GPS en attente</div>
  </header>
  <div class="grid">
    <div class="card"><div class="val main-chrono" id="chrono">00.00</div><div class="label">Chrono (s)</div></div>
    <div class="card"><div class="val" id="speed">0.0</div><div class="label">Vitesse (km/h)</div></div>
    <div class="card"><div class="val" id="gforce">0.00</div><div class="label">Force G</div></div>
    <div class="card"><div class="val" id="angle">0°</div><div class="label">Angle Virage</div></div>
  </div>
  <div class="controls">
    <button type="button" class="btn-blue" onclick="calibrate()">Calibrer 0°</button>
    <button type="button" class="btn-orange" onclick="startGate()">Grille Départ (Bip)</button>
    <button type="button" class="btn-gray" onclick="addCellHere()">+ Cellule ici</button>
    <button type="button" class="btn-gray" onclick="clearCells()">Effacer Cellules</button>
    <button type="button" class="btn-orange full-width" id="btn-arm" onclick="armAuto()">Armer Départ Auto (Mouvement)</button>
    <button type="button" class="btn-green" id="btn-start" onclick="startRun()">Démarrer Manuellement</button>
    <button type="button" class="btn-red" id="btn-stop" onclick="stopRun()" disabled>Arrêter & Sauver</button>
  </div>
  <canvas id="radar" width="400" height="260"></canvas>
  <div class="hint">Radar GPS autonome : votre tracé et vos cellules se dessinent en direct (la dernière cellule est l'ARRIVÉE).</div>
  <div class="section-box">
    <div style="font-weight:700; margin-bottom:6px; font-size:0.9rem;">Temps intermédiaires</div>
    <div id="splits-list" style="color:#64748b; font-size:0.8rem;">En attente...</div>
  </div>
  <div class="section-box">
    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <span style="font-weight:700; font-size:0.9rem;">Historique</span>
      <button type="button" class="btn-blue" onclick="exportCSV()" style="padding:4px 8px; font-size:0.75rem;">CSV</button>
    </div>
    <div id="history-list"></div>
  </div>

    <script>
    let currentPos = null, cells = [], track = [], isRunning = false, isArmed = false;
    let startTime = 0, timerInterval = null, splits = [], angleOffset = 0, rawGamma = 0;
    let maxSpeed = 0, maxG = 0, maxAngle = 0;
    const canvas = document.getElementById('radar'), ctx = canvas.getContext('2d');

    function drawRadar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
      for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

      if (!currentPos) {
        ctx.fillStyle = '#64748b'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('En attente du signal GPS extérieur...', canvas.width / 2, canvas.height / 2);
        return;
      }

      const scale = 250000;
      const toXY = (lat, lng) => ({
        x: canvas.width / 2 + (lng - currentPos.lng) * scale * Math.cos(currentPos.lat * Math.PI / 180),
        y: canvas.height / 2 - (lat - currentPos.lat) * scale
      });

      if (track.length > 1) {
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.beginPath();
        track.forEach((p, i) => { const pt = toXY(p.lat, p.lng); i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y); });
        ctx.stroke();
      }

      cells.forEach((c, idx) => {
        const pt = toXY(c.lat, c.lng), isLast = (idx === cells.length - 1);
        ctx.fillStyle = isLast ? 'rgba(239, 68, 68, 0.3)' : 'rgba(56, 189, 248, 0.3)';
        ctx.strokeStyle = isLast ? '#ef4444' : '#38bdf8'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(isLast ? 'FIN' : 'C' + c.id, pt.x, pt.y - 18);
      });

      ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 6, 0, Math.PI * 2); ctx.fill();
    }

    function addCellHere() {
      if (!currentPos) return alert("Sortez dehors pour capter le GPS avant de poser une cellule.");
      cells.push({ id: cells.length + 1, lat: currentPos.lat, lng: currentPos.lng, passed: false });
      drawRadar();
    }

    function clearCells() { cells = []; track = []; drawRadar(); }

    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(pos => {
        currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        const gpsEl = document.getElementById('gps-status');
        gpsEl.textContent = "GPS OK (±" + Math.round(pos.coords.accuracy) + "m)";
        gpsEl.classList.add('gps-ok');
        const kmh = pos.coords.speed ? (pos.coords.speed * 3.6) : 0;
        document.getElementById('speed').textContent = kmh.toFixed(1);
        if (isRunning) {
          if (kmh > maxSpeed) maxSpeed = kmh;
          track.push(currentPos);
          checkCells(currentPos.lat, currentPos.lng);
        }
        drawRadar();
      }, null, { enableHighAccuracy: true });
    }

    function checkCells(lat, lng) {
      cells.forEach((cell, idx) => {
        if (!cell.passed) {
          const R = 6371e3, p1 = lat * Math.PI/180, p2 = cell.lat * Math.PI/180;
          const dp = (cell.lat - lat) * Math.PI/180, dl = (cell.lng - lng) * Math.PI/180;
          const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
          if (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) <= 6) {
            cell.passed = true;
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
            const isLast = (idx === cells.length - 1);
            splits.push({ name: isLast ? "ARRIVÉE" : "Secteur " + cell.id, time: elapsed });
            document.getElementById('splits-list').innerHTML = splits.map(s => `<div class="list-item"><span>${s.name}</span><b>${s.time}s</b></div>`).join('');
            if (isLast) stopRun();
          }
        }
      });
    }

    function initSensors() {
      if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) {
        DeviceMotionEvent.requestPermission().then(r => { if (r === 'granted') window.addEventListener('devicemotion', onMotion); }).catch(()=>{});
      } else { window.addEventListener('devicemotion', onMotion); }
      if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
        DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') window.addEventListener('deviceorientation', onOrient); }).catch(()=>{});
      } else { window.addEventListener('deviceorientation', onOrient); }
    }

    function onMotion(e) {
      const a = e.accelerationIncludingGravity;
      if (a && a.x !== null) {
        const g = Math.sqrt(a.x**2 + a.y**2 + a.z**2) / 9.81;
        document.getElementById('gforce').textContent = g.toFixed(2);
        if (isRunning && g > maxG) maxG = g;
      }
      const l = e.acceleration;
      if (isArmed && l && l.x !== null && Math.sqrt(l.x**2 + l.y**2 + l.z**2) > 2.2) { isArmed = false; startRun(); }
    }

    function onOrient(e) {
      if (e.gamma !== null) {
        rawGamma = e.gamma;
        const ang = Math.round(rawGamma - angleOffset);
        document.getElementById('angle').textContent = ang + "°";
        if (isRunning && Math.abs(ang) > maxAngle) maxAngle = Math.abs(ang);
      }
    }

    function calibrate() { initSensors(); angleOffset = rawGamma; document.getElementById('angle').textContent = "0°"; }
    function armAuto() { initSensors(); isArmed = true; document.getElementById('btn-arm').textContent = "PRÊT - BOUGEZ..."; document.getElementById('btn-arm').style.background = "#ef4444"; }

    function startGate() {
      initSensors();
      const phrase1 = new SpeechSynthesisUtterance("OK riders, random start");
      phrase1.lang = "en-US"; phrase1.rate = 0.9;
      const phrase2 = new SpeechSynthesisUtterance("Riders ready, watch the gate");
      phrase2.lang = "en-US"; phrase2.rate = 0.9;

      window.speechSynthesis.speak(phrase1);
      phrase1.onend = function() {
        setTimeout(() => { window.speechSynthesis.speak(phrase2); }, 400);
      };

      phrase2.onend = function() {
        setTimeout(() => {
          const aCtx = new (window.AudioContext || window.webkitAudioContext)();
          [0.1, 0.7, 1.3].forEach(t => {
            const o = aCtx.createOscillator(); o.frequency.value = 632; o.connect(aCtx.destination);
            o.start(aCtx.currentTime + t); o.stop(aCtx.currentTime + t + 0.12);
          });
          const o4 = aCtx.createOscillator(); o4.frequency.value = 950; o4.connect(aCtx.destination);
          o4.start(aCtx.currentTime + 1.9); o4.stop(aCtx.currentTime + 2.3);
          setTimeout(() => { if (!isRunning) startRun(); }, 1900);
        }, 600);
      };
    }

    function startRun() {
      if (isRunning) return;
      isRunning = true; isArmed = false; startTime = Date.now();
      splits = []; track = []; maxSpeed = 0; maxG = 0; maxAngle = 0;
      cells.forEach(c => c.passed = false);
      document.getElementById('splits-list').innerHTML = "En cours...";
      document.getElementById('btn-arm').textContent = "Armer Départ Auto (Mouvement)";
      document.getElementById('btn-arm').style.background = "";
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-stop').disabled = false;
      timerInterval = setInterval(() => { document.getElementById('chrono').textContent = ((Date.now() - startTime) / 1000).toFixed(2); }, 30);
    }

    function stopRun() {
      if (!isRunning) return;
      isRunning = false; clearInterval(timerInterval);
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-stop').disabled = true;
      const h = JSON.parse(localStorage.getItem('bmx_runs') || '[]');
      h.unshift({ date: new Date().toLocaleTimeString(), time: document.getElementById('chrono').textContent, speed: maxSpeed.toFixed(1), g: maxG.toFixed(2), ang: maxAngle });
      localStorage.setItem('bmx_runs', JSON.stringify(h));
      renderHistory();
    }

    function renderHistory() {
      const h = JSON.parse(localStorage.getItem('bmx_runs') || '[]');
      document.getElementById('history-list').innerHTML = h.length ? h.map(r => `<div class="list-item"><span>${r.date} — <b>${r.time}s</b></span><span>${r.speed} km/h | ${r.g}G | ${r.ang}°</span></div>`).join('') : '<div style="color:#64748b; font-size:0.8rem;">Aucun run</div>';
    }

    function exportCSV() {
      const h = JSON.parse(localStorage.getItem('bmx_runs') || '[]');
      if (!h.length) return alert("Vide");
      const csv = "Heure;Temps;Vitesse;G;Angle\n" + h.map(r => `${r.date};${r.time};${r.speed};${r.g};${r.ang}`).join('\n');
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = "bmx.csv"; a.click();
    }

    drawRadar();
    renderHistory();
  </script>
</body>
</html>
